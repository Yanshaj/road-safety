databases:
  - name: smartroad-db
    databaseName: smartroad
    user: smartroad_user
    plan: free

services:
  - type: web
    name: smartroad-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartroad-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12
