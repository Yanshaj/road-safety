<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRoad Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        body { background-color: #0f172a; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #f8fafc; }
        #map { height: 400px; border-radius: 0.75rem; z-index: 10; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .severity-high { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .severity-medium { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .severity-low { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        
        /* Custom map popup styling */
        .leaflet-popup-content-wrapper { background-color: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); }
        .leaflet-popup-tip { background-color: #1e293b; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="w-full bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="text-amber-500">⚡</span> SmartRoad Live Dashboard
            </h1>
            <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider">Real-Time Anomaly Detection System</p>
        </div>
        <div>
            <a href="rb.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-sm transition-colors text-white">
                ⬅ Back to Synopsis
            </a>
        </div>
    </nav>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full flex flex-col gap-8">
        
        <!-- Top Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass-panel rounded-xl p-6 flex flex-col justify-center items-center">
                <div class="text-slate-400 text-sm uppercase tracking-wide font-semibold mb-1">Total Detections</div>
                <div class="text-4xl font-bold text-white" id="stat-total">-</div>
            </div>
            <div class="glass-panel rounded-xl p-6 flex flex-col justify-center items-center border-t-4 border-amber-500">
                <div class="text-slate-400 text-sm uppercase tracking-wide font-semibold mb-1">High Severity Alerts</div>
                <div class="text-4xl font-bold text-amber-500" id="stat-high">-</div>
            </div>
            <div class="glass-panel rounded-xl p-6 flex flex-col justify-center items-center">
                <div class="text-slate-400 text-sm uppercase tracking-wide font-semibold mb-1">Last Update</div>
                <div class="text-lg font-bold text-slate-300 mt-2" id="stat-time">-</div>
            </div>
        </div>

        <!-- Map Section -->
        <div class="glass-panel rounded-xl p-1 md:p-2 border border-slate-700">
            <div id="map" class="w-full"></div>
        </div>

        <!-- Data Table Section -->
        <div class="glass-panel rounded-xl overflow-hidden border border-slate-700 flex-1">
            <div class="p-5 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h2 class="text-lg font-bold text-white">Recent Event Log</h2>
                <button onclick="fetchData()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded transition-colors flex items-center gap-2">
                    <span>🔄 Refresh</span>
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="px-6 py-4">Evidence</th>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Timestamp</th>
                            <th class="px-6 py-4">Damage Type</th>
                            <th class="px-6 py-4">Severity</th>
                            <th class="px-6 py-4">Coordinates</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-800">
                        <tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Initialize Map
        const map = L.map('map').setView([37.7749, -122.4194], 12); // Default to SF or center of your data
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let markers = [];

        function getSeverityBadge(score) {
            if(score >= 0.8) return `<span class="px-2.5 py-1 rounded-full text-xs font-bold severity-high border border-red-500/20">${(score*100).toFixed(1)}% Critical</span>`;
            if(score >= 0.5) return `<span class="px-2.5 py-1 rounded-full text-xs font-bold severity-medium border border-amber-500/20">${(score*100).toFixed(1)}% Warning</span>`;
            return `<span class="px-2.5 py-1 rounded-full text-xs font-bold severity-low border border-emerald-500/20">${(score*100).toFixed(1)}% Minor</span>`;
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/v1/detections');
                const data = await response.json();
                
                updateDashboard(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('table-body').innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-red-400">Failed to load data. Is the backend running?</td></tr>`;
            }
        }

        function updateDashboard(data) {
            // Update Stats
            document.getElementById('stat-total').innerText = data.length;
            const highSeverityCount = data.filter(d => d.severity_score >= 0.8).length;
            document.getElementById('stat-high').innerText = highSeverityCount;
            document.getElementById('stat-time').innerText = new Date().toLocaleTimeString();

            // Clear old markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            // Update Map and Table
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">No detection events found.</td></tr>`;
                return;
            }

            const bounds = [];

            data.forEach(event => {
                const date = new Date(event.timestamp);
                const formattedDate = date.toLocaleString();
                
                // Add Marker
                const markerColor = event.severity_score >= 0.8 ? 'red' : (event.severity_score >= 0.5 ? 'orange' : 'green');
                const circle = L.circleMarker([event.latitude, event.longitude], {
                    radius: 8,
                    fillColor: markerColor,
                    color: "#fff",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                
                const imgHtml = event.image_url ? `<img src="${event.image_url}" class="w-full h-32 object-cover rounded mt-2 mb-2 border border-slate-700">` : '';
                
                circle.bindPopup(`
                    <div class="p-1 w-48">
                        <div class="font-bold text-amber-400 mb-1 flex items-center justify-between">
                            <span>Event #${event.id}</span>
                            ${getSeverityBadge(event.severity_score)}
                        </div>
                        ${imgHtml}
                        <div class="text-sm"><b>Type:</b> <span class="capitalize">${event.damage_type.replace('_', ' ')}</span></div>
                        <div class="text-xs text-slate-400 mt-2">${formattedDate}</div>
                    </div>
                `);
                
                markers.push(circle);
                bounds.push([event.latitude, event.longitude]);

                // Add Table Row
                const imgCell = event.image_url ? `<img src="${event.image_url}" class="w-12 h-12 rounded object-cover border border-slate-700">` : '<div class="w-12 h-12 bg-slate-800 rounded border border-slate-700 flex items-center justify-center text-xs text-slate-500">N/A</div>';
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-3">${imgCell}</td>
                    <td class="px-6 py-4 font-mono text-slate-400">#${event.id}</td>
                    <td class="px-6 py-4">${formattedDate}</td>
                    <td class="px-6 py-4 font-semibold capitalize text-white">${event.damage_type.replace('_', ' ')}</td>
                    <td class="px-6 py-4">${getSeverityBadge(event.severity_score)}</td>
                    <td class="px-6 py-4 font-mono text-xs text-slate-400">${event.latitude.toFixed(4)}, ${event.longitude.toFixed(4)}</td>
                `;
                tbody.appendChild(tr);
            });

            // Fit map to markers
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            }
        }

        // Initial fetch
        fetchData();
        
        // Auto refresh every 10 seconds
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
